<header class="header">
  <a class="logo" routerLink="/">
    <img src="harp-logo.svg" alt="Calliope logo">
    <span>Calliope</span>
  </a>

  <div class="actions">
    @if (isAuthenticated()) {
      <app-button type="default" label="Log out" (clickEvent)="logout()"/>
    } @else {
      <app-button type="default" label="Log in" (clickEvent)="login()"/>
      <app-button type="default" label="Sign in"/>
    }
  </div>
</header>
